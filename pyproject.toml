[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-lab"
version = "1.0.0"
description = "Decision science lab with sealed truth, production analytics, and churn risk services."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "duckdb>=0.10",
    "PyYAML>=6.0",
    "dbt-duckdb>=1.7",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]
dashboard = [
    "streamlit>=1.30",
]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
ml = [
    "joblib>=1.3",
    "mlflow>=3.15",
    "prometheus-client>=0.19",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.scripts]
growth-lab = "growth_lab.__main__:main"
growth-lab-train = "growth_lab.churn.train:main"
growth-lab-serve = "growth_lab.serve.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["joblib.*", "mlflow.*", "prometheus_client.*", "sklearn.*", "xgboost.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
