[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-lab"
version = "0.1.0"
description = "Decision science lab: experimentation, causal inference, marketing measurement, and forecasting — every estimate scored against a known ground truth."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "duckdb>=0.10",
    "PyYAML>=6.0",
    "dbt-duckdb>=1.7",
    # Production ML
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "mlflow>=2.10",
    # Serving
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    # Monitoring
    "prometheus-client>=0.19",
    "evidently>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
growth-lab = "growth_lab.__main__:main"
growth-lab-train = "growth_lab.churn.train:main"
growth-lab-serve = "growth_lab.serve.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
