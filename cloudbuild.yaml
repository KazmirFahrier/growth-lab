# Cloud Run deployment pipeline
# Usage: gcloud builds submit --config=cloudbuild.yaml

steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/growth-lab", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/growth-lab"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "growth-lab"
      - "--image=gcr.io/$PROJECT_ID/growth-lab"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--timeout=60s"
      - "--set-env-vars=GROWTH_LAB_DB=/app/data/growth_lab.duckdb"

images:
  - "gcr.io/$PROJECT_ID/growth-lab"
