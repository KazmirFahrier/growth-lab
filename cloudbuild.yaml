substitutions:
  _REGION: us-central1
  _REPOSITORY: growth-lab

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - churn
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/churn:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/churn:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - growth-lab-churn
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/churn:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8000
      - --memory=2Gi
      - --cpu=2
      - --min-instances=0
      - --max-instances=3
      - --timeout=60s
      - --set-secrets=GROWTH_LAB_API_KEY=growth-lab-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/churn:$COMMIT_SHA
