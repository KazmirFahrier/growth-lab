name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pinned via constraints for reproducible CI)
        run: pip install -e ".[dev,service]" -c constraints.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy
      - name: Tests (includes calibration gate + dbt build)
        run: pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          pip install build -c constraints.txt
          python -m build --wheel
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/growth-lab-wheel
          /tmp/growth-lab-wheel/bin/pip install "$(printf '%s' dist/*.whl)[service]" -c constraints.txt
          cd /tmp
          /tmp/growth-lab-wheel/bin/python -c "import growth_lab; import growth_lab.service; assert growth_lab.__version__ == '1.0.0'"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: growth-lab:ci
