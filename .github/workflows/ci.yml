name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests with coverage gate
        run: pytest --cov=growth_lab --cov-report=term --cov-fail-under=65
      - name: Seal enforcement
        run: pytest tests/test_no_truth_leak.py -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t growth-lab .
      - name: Smoke test (health check)
        run: |
          docker run -d --name growth-lab-test -p 8000:8000 growth-lab
          sleep 10
          curl -f http://localhost:8000/health || (docker logs growth-lab-test && exit 1)
          docker stop growth-lab-test

  integration:
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Simulate → Train → Evaluate end-to-end
        run: |
          python -m growth_lab build
          python -m growth_lab.churn.train --cutoff-days 60 --horizon-days 30 --no-register
