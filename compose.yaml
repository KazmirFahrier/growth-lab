services:
  analytics:
    build:
      context: .
      target: analytics
    image: growth-lab-analytics:local
    environment:
      GROWTH_LAB_API_KEY: ${GROWTH_LAB_API_KEY:?set GROWTH_LAB_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 20s

  churn:
    build:
      context: .
      target: churn
    image: growth-lab-churn:local
    environment:
      GROWTH_LAB_API_KEY: ${GROWTH_LAB_API_KEY:?set GROWTH_LAB_API_KEY}
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 20s
